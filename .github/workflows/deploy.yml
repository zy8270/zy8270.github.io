name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  # 每日定时重建：把最新 Release 的版本号/链接重新烧进静态产物，
  # 即使 App 发版后没触发本仓库（前端也会实时校正，这里是给 SSR 与搜索引擎兜底）
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 抓取最新 Release 写入快照（失败则沿用已提交的 JSON，不阻塞构建）
      - name: Fetch latest release
        run: npm run release

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
